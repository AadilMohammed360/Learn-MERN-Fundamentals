## Chapter 1

### Windows beginner setup for MERN in PowerShell

You’ll guide students through creating the project folder on a specific drive, opening PowerShell from that location, and running a readable script to create the backend and frontend and install their dependencies.

---

### Prerequisites

- **Install Node.js (LTS):** From nodejs.org, then verify in PowerShell:
  ```
  node -v
  npm -v
  ```
- **Install MongoDB Community Server + Compass:** Default settings are fine. Make sure MongoDB service is running (it usually starts automatically).

---

### Create the main project folder on your drive

1. **Open File Explorer to your drive:**
   - **Action:** Click the drive you want (example: Z:).
2. **Create the project folder:**
   - **Action:** Right‑click → New → Folder → name it `StudentCRUD`.
3. **Open the folder:**
   - **Action:** Double‑click `StudentCRUD` to enter `Z:\StudentCRUD`.

---

### Open PowerShell at that exact location

1. **Launch PowerShell from the address bar:**
   - **Action:** Click the File Explorer address bar, type `powershell`, and press Enter.
   - **Result:** PowerShell opens with the path set to your project folder (for example, `Z:\StudentCRUD`).

---

### Set up the backend and frontend

Run this script once in PowerShell from the new, empty project folder. It creates the backend and frontend folders, installs their packages, and writes the starter backend server. If it asks for framework select React and variant Javascript:

```powershell
Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
    
$ErrorActionPreference = 'Stop'

New-Item -ItemType Directory -Force backend, frontend | Out-Null

Push-Location backend
npm init -y
npm pkg set type=module main=server.js 'scripts.dev=nodemon server.js' 'scripts.start=node server.js'
npm install express 'mongoose@^8' cors dotenv
npm install --save-dev nodemon

@'
import express from 'express';
import cors from 'cors';
import dotenv from 'dotenv';

dotenv.config();

const app = express();
const port = process.env.PORT || 8000;

app.use(cors());
app.use(express.json());

app.get('/', (_request, response) => {
  response.json(`Backend Server is running`);
});

app.get('/api/health', (_request, response) => {
  response.json({ status: 'ok' });
});

app.listen(port, () => {
  console.log(`Backend Server running on port: ${port}`);
});
'@ | Set-Content -Encoding utf8 server.js
Pop-Location

npm create vite@6 frontend -- --template react
Push-Location frontend
npm install
npm install axios
Pop-Location
```

OR

---

## 🔎 What the setup script does

- **`$ErrorActionPreference = 'Stop'`**  
  Makes PowerShell stop on terminating PowerShell errors. Check that each npm command completes successfully before continuing.

- **`New-Item -ItemType Directory -Force backend, frontend`**  
  Creates the backend and frontend folders if they do not already exist.

- **`Push-Location backend` / `Pop-Location`**  
  Temporarily changes into the backend folder to run its npm commands and create `server.js`, then returns to the project folder.

- **`npm init -y`**  
  Initializes `backend/package.json` with default settings.

- **`npm pkg set ...`**  
  Configures the backend as an ES module project and adds `dev` (nodemon) and `start` (Node.js) scripts.

- **Backend `npm install` commands**  
  Install Express, Mongoose 8, CORS, and dotenv as runtime dependencies, and nodemon as a development dependency.

- **`Set-Content ... server.js`**  
  Writes the starter Express server, which enables CORS and JSON parsing and provides `/` and `/api/health` routes.

- **`npm create vite@6 frontend -- --template react`**  
  Creates a React frontend using Vite 6.

- **Frontend `npm install` commands**  
  Install the Vite/React project dependencies and Axios.

---

## ✅ Quick checkpoints
- **Folders created:** `backend` and `frontend` inside the project folder.  
- **Backend ready:** `backend/server.js` exists, backend `package.json` has `dev` and `start` scripts, and backend dependencies are installed.  
- **Frontend ready:** Vite React app initialized, dependencies installed, and Axios added.  
- **Servers:** Not started by this setup script; start them from their respective folders as described in Chapter 3.

## Chapter 2

### 🛠️ Common Node.js Installation Errors and Fixes (Windows)

### 1. Error:  
`npm: %programfiles%\nodejs\npm.ps1 cannot be loaded because running scripts is disabled in this system`

**Cause:** Windows PowerShell blocks script execution by default.  

**Fix:**
- In PowerShell, try calling the Windows command shim directly:
  ```powershell
  npm.cmd -v
  ```
  For npm commands in the Chapter 1 setup script, use `npm.cmd` instead of `npm` if PowerShell blocks `npm.ps1`.
- Alternatively, if you want to use the `npm` PowerShell shim, you can allow locally installed scripts for your Windows user. Open PowerShell and run:
  ```powershell
  Set-ExecutionPolicy -Scope CurrentUser RemoteSigned
  ```
  Review the policy change before confirming it. Then reopen PowerShell and verify with `npm -v`.

---

### 2. Error:  
`npm is not recognised as a command or cmdlet`

**Cause:** The npm folder is missing or not properly linked in PATH.  

**Fix (step‑by‑step):**
1. Navigate to your Node.js installation folder (usually `C:\Program Files\nodejs`).  
2. Check if there’s a folder named `npm`.  
3. If missing:  
   - Right‑click → New → Folder → name it `npm`.  
   - Restart Command Prompt.  
4. Verify npm works:  
   ```cmd
   npm -v
   ```

---

### 3. Error:  
`'node' is not recognised as an internal or external command, operable program or batch file`

**Cause:** Windows environment variables were not set properly during installation. System protection policies sometimes prevent the installer from updating PATH to include Node.js and npm executables.

**Fix (step‑by‑step):**
1. Press **Win + R**, type `sysdm.cpl`, and hit Enter.  
2. In the **System Properties** window, go to the **Advanced** tab → click **Environment Variables**.  
3. Under **System variables**, find and select `Path` → click **Edit**.  
4. Click **New** and add the following paths (adjust if Node.js is installed elsewhere):  
   ```
   C:\Program Files\nodejs\
   C:\Users\<YourUsername>\AppData\Roaming\npm
   ```  
5. Click **OK** to save changes, then close all dialogs.  
6. Restart Command Prompt.  
7. Test with:  
   ```cmd
   node -v
   npm -v
   ```  
   → Both should now return version numbers.

## Chapter 3

### How to run the project next time

1. **Open your project folder in File Explorer**  
   - Navigate to the main folder of your project (for example, `Z:\StudentCRUD`) which contains the backend and frontend.

2. **Open two PowerShell windows in the project folder**  
   - In File Explorer, click the address bar, type `powershell`, and press Enter.  
   - Repeat to open a second PowerShell window in the same project folder (e.g., `Z:\StudentCRUD`).

3. **Start the backend server**  
   - In the first PowerShell window, run:
     ```powershell
     cd backend
     npm run dev
     ```
   - This starts your Express server with nodemon.

4. **Start the frontend app**  
   - In the second PowerShell window, run:
     ```powershell
     cd frontend
     npm run dev
     ```
   - This starts the Vite React app.

5. **Access the app in your browser**  
   - Vite usually runs on [http://localhost:5173](http://localhost:5173).  
   - Your backend runs on [http://localhost:8000](http://localhost:8000) unless you changed the port.

---

That’s all you need to get the project running again after the initial setup.

### Understanding the MERN project folder structure

Your project is divided into a **backend** (Node.js, Express, and Mongoose) and a **frontend** (React and Vite). Here is a simplified view of the important folders and files:

```text
StudentCRUD/
├── backend/
│   ├── node_modules/
│   ├── models/
│   │   └── student.js
│   ├── .env
│   ├── package.json
│   └── server.js
├── frontend/
│   ├── node_modules/
│   ├── src/
│   │   ├── assets/
│   │   ├── App.jsx
│   │   ├── App.css
│   │   ├── index.css
│   │   └── main.jsx
│   ├── index.html
│   └── package.json
└── index.html  (this tutorial)
```

#### Backend files and folders

- **`backend/node_modules/`** — Packages installed for the backend, such as Express, Mongoose, and Nodemon. npm creates this folder; don’t edit it manually. It can be recreated by running `npm install` inside `backend`.
- **`backend/package.json`** — The backend project manifest. It lists its dependencies and defines commands such as `npm run dev` and `npm start`.
- **`backend/server.js`** — The Express server entry point. It configures middleware, connects to MongoDB, starts listening for requests, and defines the API routes.
- **`backend/.env`** — Local environment settings, including `MONGODB_URI`. Keep secrets and machine-specific settings out of source control; don’t share or commit this file.
- **`backend/models/`** — Mongoose models that define the shape of database documents and provide methods for working with them.
- **`backend/models/student.js`** — Defines and exports the `Student` model used by the CRUD API routes.

#### Frontend files and folders

- **`frontend/node_modules/`** — Packages installed for the frontend, such as React, Vite, and Axios. This is separate from the backend’s dependencies and is recreated with `npm install` inside `frontend`.
- **`frontend/package.json`** — The frontend project manifest. It lists its dependencies and scripts, including `npm run dev`, `npm run build`, and `npm run lint`.
- **`frontend/index.html`** — Vite’s HTML entry page. It contains the root element where React mounts the application and loads the frontend entry module.
- **`frontend/src/`** — The main React application source folder. `App.jsx` contains the app UI, `main.jsx` mounts the React app into the HTML root, and the CSS files provide styling.

> There are two different `index.html` files: `frontend/index.html` is the Vite app’s entry page; the root-level `index.html` in this tutorial project contains these teaching notes.

## Chapter 4  
### Familiarising with MongoDB Compass

**Goal:** Students learn to use Compass GUI to create a database, a collection, and insert records. They also understand how MongoDB documents relate to traditional relational databases.

---

#### Step 1: Launch Compass and connect
- Open **MongoDB Compass**.  
- Sidebar -> Look for `Connections` and click `+` icon to add new connection
- Set and Enable Default connection string:  
  ```
  mongodb://localhost:27017
  ```
- Name connection as `Local` , `set a color` and Click `Save`
- Sidebar -> Look for `Local` in your `sidebar` and Click **Connect**.

---

#### Step 2: Create a database and collection
1. Sidebar -> `Local` -> Click `+` icon to  **“Create Database”**.  
2. Enter:
   - **Database name:** `learnMERN`  
   - **Collection name:** `students`  
3. Click **Create Database**.

---

#### Step 3: Insert records via GUI
1. Open `Sidebar` -> `Local > learnMERN > students`.  
2. From `Add Data` Click **Insert Document**.  
3. Add JSON documents like:
   ```json
   { "name": "Aisha", "email": "aisha@example.com", "age": 20 }
   ```
   ```json
   { "name": "Ravi", "email": "ravi@example.com", "age": 22 }
   ```
   ```json
   { "name": "Meera", "email": "meera@example.com", "age": 21 }
   ```
   OR
   ```json

      { "name": "Aisha", "email": "aisha@example.com", "age": 20 },

> Make sure to `Refresh` if you dont see your records

---

#### Step 4: Understand JSON vs BSON
- **JSON:** Human-readable text format you type in Compass or code.  
- **BSON:** Binary JSON used internally by MongoDB, supports extra types like `ObjectId`, `Date`.  
- **Analogy with MySQL:**  
  - Database ≈ Schema  
  - Collection ≈ Table  
  - Document ≈ Row  
  - Field ≈ Column  
  - ObjectId ≈ Auto-increment primary key (but globally unique)

---

## Chapter 5  
### CRUD Operations at Express backend via `server.js`

**Goal:** Students perform CRUD operations programmatically using Express + Mongoose, verifying changes in Compass after each step.

---

## ✅ Step 0: Create the Student model and connect to MongoDB

Keep the schema/model separate from the Express server. The model describes student documents; `server.js` owns the database connection and API routes.

1. In the `backend` folder, create a `models` folder and a file named `student.js`.
2. Add this code to `backend/models/student.js`:
   ```js
   import mongoose from 'mongoose';

   const studentSchema = new mongoose.Schema({
     name: { type: String, required: true },
     email: { type: String, required: true },
     age: { type: Number, required: true }
   });

   const Student = mongoose.model('Student', studentSchema, 'students');

   export default Student;
   ```
   The third argument explicitly sets the collection name to `students`.
3. Create `backend/.env` with your local MongoDB connection string:
   ```env
   MONGODB_URI=mongodb://127.0.0.1:27017/learnMERN
   ```
   Add `.env` to `backend/.gitignore` so connection settings are not committed:
   ```gitignore
   node_modules/
   .env
   ```
4. In `backend/server.js`, add these imports alongside the existing imports:
   ```js
   import mongoose from 'mongoose';
   import Student from './models/student.js';
   ```
5. Replace the existing `app.listen(...)` at the bottom of `server.js` with:
   ```js
   const startMongoServer = async () => {
     try {
       await mongoose.connect(process.env.MONGODB_URI);
       console.log('Connected to MongoDB');
       app.listen(port, () => {
         console.log(`Server running on port: ${port}`);
       });
     } catch (error) {
       console.error('Failed to connect to MongoDB:', error);
       process.exit(1);
     }
   };

   startMongoServer();
   ```

- **Database:** `learnMERN`, specified after the final `/` in `MONGODB_URI`.
- **Collection:** `students`, specified explicitly as the third argument to `mongoose.model()`.
- **Schema:** Defines document fields, types, and validation rules.
- **Model:** `Student` provides methods such as `find()`, `create()`, and `findByIdAndUpdate()`.
- **Connection:** `server.js` connects before it starts listening, so routes do not serve requests before MongoDB is ready.

---

### CRUD Operations

The examples below are routes to add to `server.js`. The `Student` model is already imported in Step 0.

#### Step 1: List students (Read)
- Add a GET route in `server.js`:
  ```js
  app.get('/api/students', async (req, res) => {
    try {
      const students = await Student.find();
      res.json(students);
    } catch (err) {
      res.status(500).json({ error: err.message });
    }
  });
  ```
- **Test:** Open new cmd window and run the following:
   ```c
   curl http://localhost:8000/api/students
   ```  
- **Verify:** Matches the records inserted via Compass GUI.

---

#### Step 2: Insert record (Create)
- Add a POST route:
  ```js
   app.post('/api/students', async (req, res) => {
      try {
      const student = await Student.create(req.body);
      res.status(201).json("Record inserted");
      } catch (err) {
      res.status(400).json({ error: err.message });
      }
   });
  ```
  > You can use this instead see the inserted record:
  > `res.status(201).json(student);`
- **Test:** Open new cmd window and run the following:
   ```c
   curl -X POST http://localhost:8000/api/students ^
   -H "Content-Type: application/json" ^
   -d "{\"name\":\"Shashi\",\"email\":\"shashi@example.com\",\"age\":22}"
   ```  
- **Verify:** New record appears in Compass.

---

#### Step 3: Delete record (Delete)
- Add a DELETE route:
  ```js
  app.delete('/api/students/:id', async (req, res) => {
    try {
      await Student.findByIdAndDelete(req.params.id);
      res.json("Record Deleted");
    } catch (err) {
      res.status(400).json({ error: err.message });
    }
  });
  ```
- **Test:** Open new cmd window and run the following:
   ```c
   curl -X DELETE http://localhost:8000/api/students/692850edf9d3c59a5694b299
   ```  
- **Verify:** Document disappears from Compass.

---

#### Step 4: Update record (Update)
- Add a PUT route:
  ```js
  app.put('/api/students/:id', async (req, res) => {
    try {
      const student = await Student.findByIdAndUpdate(
        req.params.id,
        req.body,
        { new: true }
      );
      res.json("Record Updated");
    } catch (err) {
      res.status(400).json({ error: err.message });
    }
  });
  ```
- **Test:** Open new cmd window and run the following:
   ```c
   curl -X PUT http://localhost:8000/api/students/692850edf9d3c59a5694b299 ^
   -H "Content-Type: application/json" ^
   -d "{\"age\":23}"
   ```  
- **Verify:** Compass shows updated document.

---

### Test the same CRUD routes with Postman in VS Code

Postman is an alternative to the curl commands above. Keep the backend running in one terminal while sending requests from Postman.

1. In VS Code, open **Extensions** (`Ctrl+Shift+X`), search for **Postman**, and install the Postman extension published by Postman.
2. Open the Postman panel from the Activity Bar, create a new HTTP request, and set its URL to `http://localhost:8000`.
3. For each operation below, select the HTTP method, enter the full URL, and click **Send**:

| Operation | Method | URL | Body |
|---|---|---|---|
| List students | `GET` | `http://localhost:8000/api/students` | None |
| Insert student | `POST` | `http://localhost:8000/api/students` | Select **Body** → **raw** → **JSON**, then enter `{"name":"Shashi","email":"shashi@example.com","age":22}` |
| Delete student | `DELETE` | `http://localhost:8000/api/students/<studentId>` | None |
| Update student | `PUT` | `http://localhost:8000/api/students/<studentId>` | Select **Body** → **raw** → **JSON**, then enter `{"age":23}` |

For `<studentId>`, first send the list request and copy the `_id` value of an existing student from the response. Use that same ID for the delete or update request. Postman sets the JSON content type when you choose **raw** and **JSON** for the body.

- **Verify:** Check the response in Postman and confirm the inserted, updated, or deleted document in MongoDB Compass. The POST and PUT examples currently return confirmation text; send the GET request again to inspect the stored values.

---

## Chapter 6 
    
### step by step: React frontend CRUD

This walkthrough builds the frontend piece by piece. Each step extends the previous code, so students can paste, run, and see the app evolve toward the final working App.js.

---

### Step 1: Fetch and display the student list

#### What students learn
- **useState:** Store students in component state.
- **useEffect:** Run code once on mount to fetch data.
- **fetch:** Call the backend’s GET API.

#### Code to paste (App.js)
```jsx
import React, { useState, useEffect } from "react";

function App() {
  const [students, setStudents] = useState([]);

  // Load students on initial render
  useEffect(() => {
    fetch("http://localhost:8000/api/students")
      .then(res => res.json())
      .then(data => setStudents(data));
  }, []);

  return (
    <div style={{ margin: "2rem", fontFamily: "Arial, sans-serif" }}>
      <h1>🎓 Student Management</h1>

      {/* Student List */}
      <ul>
        {students.map(s => (
          <li key={s._id}>
            {s.name} ({s.age}) - {s.email}
          </li>
        ))}
      </ul>
    </div>
  );
}

export default App;
```

#### Key ideas
- **State:** `students` holds the current list.
- **Effect:** `useEffect` with `[]` runs once to fetch on mount.
- **Rendering:** Map over `students` and show each document.

---

### Step 2: Add delete operation to the list

#### What students learn
- **Event handlers:** Trigger actions from UI.
- **HTTP DELETE:** Remove a record via API.
- **Reload pattern:** After mutation, re-fetch the list for consistency.

#### Code to paste (replace the App component with this)
```jsx
import React, { useState, useEffect } from "react";

function App() {
  const [students, setStudents] = useState([]);

  const loadStudents = () => {
    fetch("http://localhost:8000/api/students")
      .then(res => res.json())
      .then(data => setStudents(data));
  };

  useEffect(() => {
    loadStudents();
  }, []);

// <=== New Code Here ===>
  const handleDelete = id => {
    fetch(`http://localhost:8000/api/students/${id}`, { method: "DELETE" })
      .then(() => loadStudents());

          <li key={s._id} style={{ marginBottom: "0.5rem" }}>
            {s.name} ({s.age}) - {s.email}
            // <=== New Code Here ===>
            <button onClick={() => handleDelete(s._id)} style={{ marginLeft: "0.5rem" }}>
              Delete
            </button>
            // <=== New Code Here ===>
          </li>
        ))}
      </ul>
    </div>
  );
}

### Step 4: Implement update using the same form

#### What students learn
- **Edit mode:** Track which record is being edited.
- **PUT:** Send updates to backend.
- **Form reuse:** Populate form with selected student, switch button label.

#### Code to paste (final step before the complete app)
```jsx
import React, { useState, useEffect } from "react";

function App() {
  const [students, setStudents] = useState([]);
  const [form, setForm] = useState({ name: "", email: "", age: "" });
  const [editingId, setEditingId] = useState(null);

  const loadStudents = () => {
    fetch("http://localhost:8000/api/students")
      .then(res => res.json())
      .then(data => setStudents(data));
  };

  useEffect(() => {
    loadStudents();
  }, []);

  const handleChange = e => {
    setForm({ ...form, [e.target.name]: e.target.value });
  };

// <=== New Code Here ===>
  const handleSubmit = e => {
    e.preventDefault();

    if (editingId) {
      // Update existing student
      fetch(`http://localhost:8000/api/students/${editingId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(form)
      })
        .then(res => res.json())
        .then(() => {
          loadStudents();
          setForm({ name: "", email: "", age: "" });
          setEditingId(null);
        });
    } else {
      // Create new student
      fetch("http://localhost:8000/api/students", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(form)
      })
        .then(res => res.json())
        .then(() => {
          loadStudents();
          setForm({ name: "", email: "", age: "" });
        });
    }

  };
// <=== New Code Here ===>    

  const handleDelete = id => {
    fetch(`http://localhost:8000/api/students/${id}`, { method: "DELETE" })
      .then(() => loadStudents());
  };

// <=== New Code Here ===>
  const handleEdit = student => {
    setForm({ name: student.name, email: student.email, age: student.age });
    setEditingId(student._id);
  };
// <=== New Code Here ===>

  return (
    <div style={{ margin: "2rem", fontFamily: "Arial, sans-serif" }}>
      <h1>🎓 Student Management</h1>

      {/* Form */}
      <form onSubmit={handleSubmit} style={{ marginBottom: "1rem" }}>
        <input
          name="name"
          placeholder="Name"
          value={form.name}
          onChange={handleChange}
          required
        />
        <input
          name="email"
          placeholder="Email"
          value={form.email}
          onChange={handleChange}
          required
        />
        <input
          name="age"
          placeholder="Age"
          value={form.age}
          onChange={handleChange}
          required
        />
        <button type="submit">
          {editingId ? "Update Student" : "Add Student"}
        </button>
      </form>

      {/* Student List */}
      <ul>
        {students.map(s => (
          <li key={s._id} style={{ marginBottom: "0.5rem" }}>
            {s.name} ({s.age}) - {s.email}

            // <=== New Code Here ===>
            <button onClick={() => handleEdit(s)} style={{ marginLeft: "1rem" }}>
              Edit
            </button>
            // <=== New Code Here ===>   

            <button onClick={() => handleDelete(s._id)} style={{ marginLeft: "0.5rem" }}>
              Delete
            </button>
          </li>
        ))}
      </ul>
    </div>
  );
}

export default App;
```

#### Key ideas
- **Editing state:** `editingId` toggles between create and update modes.
- **Form reuse:** Same inputs handle both operations.
- **Consistency:** After any mutation (POST/PUT/DELETE), call `loadStudents()`.
